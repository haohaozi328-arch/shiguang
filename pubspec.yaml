name: shiguanlast
description: "拾光最终集成版"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  gif_view: ^1.0.3
  google_fonts: ^6.2.1
  provider: ^6.0.0
  record: ^5.1.2
  http: ^1.1.0
  dio: ^5.3.0
  shared_preferences: ^2.2.0
  path_provider: ^2.1.0
  permission_handler: ^11.3.1
  image_picker: ^1.1.2
  flutter_foreground_task: ^8.10.3
  sherpa_onnx: ^1.12.36
  share_plus: ^12.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  record_linux: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - ui/
    - assets/paraformer/encoder.int8.onnx
    - assets/paraformer/decoder.int8.onnx
    - assets/paraformer/tokens.txt
    - assets/sensevoice/model.int8.onnx
    - assets/sensevoice/tokens.txt
    - assets/sensevoice/zh.wav
